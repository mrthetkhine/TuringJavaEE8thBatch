<c-modal
  [transition]="false"
  [visible]="visible"

>
  <c-modal-header>
    <h5 cModalTitle>{{title()}}</h5>
    <button cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <ng-content/>
  </c-modal-body>
  <c-modal-footer>
    <button cButton color="primary" type="button"  (click)="onSuccessHandle()" >Yes</button>
    <button cButton color="secondary" type="button" (click)="close()" >No</button>
  </c-modal-footer>
</c-modal>
