<c-row ngPreserveWhitespaces>
  <c-row class="mb-3">
    <c-col [sm]="2">
      <button cButton color="primary"
              (click)="handleBack()"
              type="button">
        Back
      </button>
    </c-col>
  </c-row>
  <c-card>
    <c-card-body>
      <c-row>
        <h5 cCardTitle>Movie Details</h5>
      </c-row>
      <c-row class="mb-3">
        <label cLabel="col" cCol [sm]="2" for="title">
          Title
        </label>
        <c-col [sm]="10">
          <input cFormControl
                 [value]="movie?.title"
                 readonly/>

        </c-col>
      </c-row>
      <c-row class="mb-3">
        <label cLabel="col" cCol [sm]="2" for="year">
          Year
        </label>
        <c-col [sm]="10">
          <input cFormControl
                 [value]="movie?.year"
                 readonly/>
        </c-col>
      </c-row>
      <c-row class="mb-3">
        <label cLabel="col" cCol [sm]="2" for="director">
          Director
        </label>
        <c-col [sm]="10">
          <input cFormControl
                 [value]="movie?.director"
                 readonly/>

        </c-col>
      </c-row>
      <c-row class="mb-3">
        <label cLabel="col" cCol [sm]="2" for="genres">
          Genres
        </label>
        <c-col [sm]="10">
          <input cFormControl
                 [value]="movie?.genres"
                 readonly/>

        </c-col>
      </c-row>
      <c-row class="mb-3">
        <label cLabel="col" cCol [sm]="2" for="director">
          Details
        </label>
        <c-col [sm]="10">
          <input cFormControl
                 [value]="movie?.details?.details"
                 readonly/>
        </c-col>
      </c-row>
    </c-card-body>

  </c-card>


    <c-card>
      <c-card-body>
        <form cForm [formRoot]="assignedActorForm">
        <c-row >
        <c-col [sm]="5">
          <select cSelect aria-label="Select Actor"
                  [class.is-invalid]="assignedActorForm.id().touched() &&  assignedActorForm.id().invalid()"
                  [formField]="assignedActorForm.id">
            @for (actor of actorService.actors() ; track actor.id) {
              <option [value]="actor.id">{{actor.firstName + ' '+actor.lastName}}</option>
            }
          </select>
        </c-col>
        <c-col [sm]="2">
          <button cButton color="primary"
                  type="submit">
            Assigned Actor
          </button>
        </c-col>
        </c-row>
        </form>
      </c-card-body>
    </c-card>

</c-row>

<c-row ngPreserveWhitespaces>
  <c-row ngPreserveWhitespaces>
    <table cTable>
      <thead>
        <tr>
          <th scope="col">First Name</th>
          <th scope="col">Last Name</th>
        </tr>
      </thead>
      <tbody>
        @for(actor of movie?.actors;track actor.id){
          <tr>
            <td>{{actor.firstName}}</td>
            <td>{{actor.lastName }}</td>
          </tr>
        }
      </tbody>
    </table>
  </c-row>
</c-row>
