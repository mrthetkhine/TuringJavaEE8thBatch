<h3>Template Driven Form</h3>
<form (ngSubmit)="onSubmit()" #movieForm="ngForm">
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" class="form-control"
           id="title"
           required
           [(ngModel)]="movie.title"
           name="title"
           minlength="4"
           #title="ngModel">
    @if (title.invalid && (title.dirty || title.touched)) {
      <div class="alert alert-danger">
        @if (title.hasError('required')) {
          <div>Title is required.</div>
        }
        @if (title.hasError('minlength')) {
          <div>Title must be at least 4 characters long.</div>
        }

      </div>
    }

  </div>
  <div class="form-group">
    <label for="year">Year</label>
    <input type="text"
           class="form-control"
           required
           id="year"
           [(ngModel)]="movie.year"
           name="year"
           #year="ngModel" >
    <div [hidden]="year.valid || year.pristine" class="alert alert-danger">
      Year is required
    </div>
  </div>
  <div>
    <button type="submit" class="btn btn-primary"
            [disabled]="!movieForm.form.valid">Submit</button>
  </div>
</form>
