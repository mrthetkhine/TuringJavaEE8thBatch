<div>
  <app-actor-count/>
  <app-new-actor-form/>
  <h1>Actor List</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Gender</th>
      </tr>
    </thead>
    <tbody>
      @for(actor of actorService.actors();track actor.id){
        <tr>
          <td>
            {{actor.firstName}}
          </td>
          <td>
            {{actor.lastName}}
          </td>
          <td>
            {{actor.gender}}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
